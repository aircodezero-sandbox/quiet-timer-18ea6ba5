<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiet Timer</title>
  <style>
    :root { color-scheme: dark; font-family: Inter, ui-sans-serif, system-ui, sans-serif; background: #09090b; color: #fafafa; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at top, #312e81, #09090b 58%); }
    main { width: min(92vw, 34rem); padding: 2rem; border: 1px solid #3f3f46; border-radius: 1.25rem; background: rgba(24, 24, 27, .92); box-shadow: 0 24px 80px rgba(0,0,0,.45); }
    .eyebrow { color: #a5b4fc; font-size: .75rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: .65rem 0; font-size: clamp(2rem, 8vw, 3.5rem); }
    p { color: #d4d4d8; line-height: 1.6; }
    button { width: 100%; margin-top: 1rem; padding: .9rem 1rem; border: 0; border-radius: .65rem; background: #818cf8; color: #18181b; font: inherit; font-weight: 800; cursor: pointer; }
    button:focus-visible { outline: 3px solid #fbbf24; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">Marketplace dogfood</div>
    <h1>Quiet Timer</h1>
    <p>A minimal source-closed Free app used only for Marketplace dogfood.</p>
    <button type="button" id="action">Start a 5-minute focus</button>
    <p id="status" role="status">Ready.</p>
  </main>
  <script>
    document.querySelector("#action").addEventListener("click", () => {
      document.querySelector("#status").textContent = "Focus session started locally.";
    });
  </script>
</body>
</html>
